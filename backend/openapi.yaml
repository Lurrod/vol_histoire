  # ═══════════════════════════════════════════════════════════
  # STATS
  # ═══════════════════════════════════════════════════════════
  /stats:
    get:
      tags: [Stats]
      summary: Statistiques globales
      description: Cache en mémoire (TTL 5 min), invalidé à chaque modification d'avion.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'

  # ═══════════════════════════════════════════════════════════
  # HERO
  # ═══════════════════════════════════════════════════════════
  /hero/discoveries:
    get:
      tags: [Hero]
      summary: Données dynamiques des widgets de la home
      description: |
        Renvoie en un seul payload les anniversaires du jour (éphéméride), les
        facts éditoriaux (timeline_events liés à un appareil) et la liste des
        appareils avec image, utilisés par les widgets "Ce jour-là" et
        "Devine l'avion" sur la landing page.

        `day` est la date de référence en Europe/Paris : le client s'en sert
        comme graine pour l'appareil du jour, afin que tous les visiteurs voient
        le même quel que soit leur fuseau.

        `ephemeris` liste les premiers vols et mises en service tombant à ± 3
        jours de cette date, triés par écart croissant. Les dates au 1er du mois
        sont exclues : elles encodent un mois sans jour connu (223 des 330 mises
        en service), pas un vrai anniversaire.

        Cache 10 min (Redis ou mémoire), **clé par jour**, invalidé à chaque
        CRUD avion.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at:
                    type: string
                    format: date-time
                  day:
                    type: string
                    format: date
                    description: Date de référence (Europe/Paris), graine du tirage du jour
                    example: '2026-09-08'
                  ephemeris:
                    type: array
                    description: Anniversaires à ± 3 jours de `day`, du plus proche au plus lointain
                    items:
                      type: object
                      properties:
                        kind: { type: string, enum: [first_flight, service] }
                        day_gap: { type: integer, description: Écart en jours avec `day` (0 = anniversaire du jour) }
                        event_date: { type: string, format: date, example: '1968-09-08' }
                        year: { type: integer }
                        airplane_id: { type: integer }
                        airplane_name: { type: string }
                        airplane_name_en: { type: string, nullable: true }
                  facts:
                    type: array
                    items:
                      type: object
                      properties:
                        year: { type: integer, nullable: true }
                        title_fr: { type: string }
                        title_en: { type: string }
                        airplane_id: { type: integer, nullable: true, description: ID de la fiche avion liée, pour lien direct /details?id=N }
                        airplane_name: { type: string, nullable: true }
                        airplane_name_en: { type: string, nullable: true }
                  aircraft:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, description: ID de la fiche avion, pour lien direct /details?id=N }
                        name: { type: string }
                        name_en: { type: string, nullable: true }
                        image_url: { type: string }
                        generation: { type: integer, nullable: true }
                        type_name: { type: string, nullable: true }
                        type_name_en: { type: string, nullable: true }

  # ═══════════════════════════════════════════════════════════
  # CONFIG
  # ═══════════════════════════════════════════════════════════
  /config:
    get:
      tags: [Config]
      summary: Configuration publique exposée au frontend
      description: |
        Retourne la version applicative et la sitekey hCaptcha (publique).
        Le frontend lit cet endpoint au boot pour décider s'il doit charger
        le widget captcha. Cache 5 minutes.
      responses:
        '200':
          description: Configuration publique
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                    example: "4.6.0"
                  hcaptchaSitekey:
                    type: string
                    nullable: true
                    description: Sitekey publique hCaptcha, ou `null` si non configurée

  /csp-report:
    post:
      tags: [Monitoring]
      summary: Recevoir un rapport de violation CSP
      description: |
        Cible des directives `report-uri` et `report-to` (en-tête
        `Reporting-Endpoints: csp-endpoint="/api/csp-report"`). Accepte
        l'ancien format `application/csp-report` et la Reporting API
        `application/reports+json` (lot de rapports ; seuls les
        `csp-violation` sont lus, 10 au plus par envoi). Chaque violation est
        journalisée en `warn` avec les URL réduites à origine + chemin ; rien
        n'est stocké, ni IP ni user-agent. Corps limité à 16 Ko, 60 envois par
        15 minutes et par IP.
      requestBody:
        required: true
        content:
          application/csp-report:
            schema:
              type: object
              properties:
                csp-report:
                  type: object
                  additionalProperties: true
          application/reports+json:
            schema:
              type: array
              items:
                type: object
                properties:
                  type: { type: string, example: csp-violation }
                  body: { type: object, additionalProperties: true }
      responses:
        '204':
          description: Rapport reçu
        '400':
          description: Corps JSON mal formé
        '413':
          description: Corps de plus de 16 Ko
        '415':
          description: Type de contenu non pris en charge
        '429':
          description: Trop de rapports

  # ═══════════════════════════════════════════════════════════
  # MONITORING
  # ═══════════════════════════════════════════════════════════
  /live:
    get:
      tags: [Monitoring]
      summary: Liveness probe
      description: |
        Toujours `200` tant que le process Express tourne. Aucune dépendance
        vérifiée — utiliser `/ready` pour la vraie santé applicative.
        Adapté pour Kubernetes `livenessProbe` ou un uptime monitor basique.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  uptime: { type: number, description: Uptime du process en secondes }

  /ready:
    get:
      tags: [Monitoring]
      summary: Readiness probe
      description: |
        Vérifie que le pool PostgreSQL est initialisé et qu'un `SELECT 1`
        passe. Retourne `503` si la BD est inaccessible.
        Adapté pour Kubernetes `readinessProbe` ou un load balancer healthcheck.
      responses:
        '200':
          description: Application prête
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ready }
                  db:
                    type: object
                    properties:
                      ok: { type: boolean, example: true }
                      latencyMs: { type: integer, example: 3 }
        '503':
          description: BD inaccessible
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: not_ready }
                  db:
                    type: object
                    properties:
                      ok: { type: boolean, example: false }

  /metrics:
    get:
      tags: [Monitoring]
      summary: Métriques Prometheus
      description: |
        Texte plain Prometheus exposant les compteurs HTTP, latences,
        Node.js process metrics (heap, GC, event loop, etc.).
        Si la variable d'environnement `METRICS_TOKEN` est configurée,
        le endpoint exige `Authorization: Bearer <token>`.
      responses:
        '200':
          description: Métriques Prometheus
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP process_cpu_user_seconds_total Total user CPU time spent in seconds.
                  # TYPE process_cpu_user_seconds_total counter
                  process_cpu_user_seconds_total 1.234
        '401':
          description: Token manquant ou invalide (si `METRICS_TOKEN` configuré)

  /status:
    get:
      tags: [Monitoring]
      summary: Statut applicatif lisible
      description: |
        Retourne version, environnement, état Sentry, uptime, timestamp de
        démarrage et commit Git si exposé. Utilisé par les outils d'uptime
        et le frontend pour afficher la version courante.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  service: { type: string, example: "Vol d'histoire" }
                  version: { type: string, example: "4.6.0" }
                  env: { type: string, example: production }
                  sentry: { type: boolean, example: true }
                  uptimeSec: { type: integer, example: 3600 }
                  startedAt:
                    type: string
                    format: date-time
                    example: "2026-04-08T10:00:00.000Z"
                  commit:
                    type: string
                    nullable: true
                    description: Git commit hash si `GIT_COMMIT` env est défini
