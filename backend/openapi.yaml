openapi: 3.0.3
info:
  title: Vol d'Histoire API
  description: |
    API REST de l'encyclopédie de l'aviation militaire **Vol d'Histoire**.

    ## Authentification
    JWT en header `Authorization: Bearer <access_token>` (15 min) +
    refresh token en cookie HttpOnly (7 jours, rotation au refresh).

    ## Internationalisation
    Détectée via `?lang=fr|en` ou `Accept-Language`. Les fiches d'avions
    exposent `name_fr` / `country_name_fr` / `type_name_fr` en plus des
    champs traduits, comme **clés stables côté client** (utilisées dans les
    URLs de filtres pour rester valides indépendamment de la langue d'affichage).

    ## Anti-spam
    Les routes `/register` et `/auth/forgot-password` acceptent un token
    hCaptcha dans le body (`h-captcha-response`). Si `HCAPTCHA_SECRET`
    n'est pas configuré côté serveur, la vérification est skippée (mode dev).

    ## Cache & versioning
    Toutes les pages HTML sont servies avec un query string `?v=<version>`
    sur les assets pour bust le cache navigateur à chaque déploiement.
    Les statiques (CSS/JS/fonts) ont un `Cache-Control` long.

    ## Erreurs de requête communes
    - **400** : corps JSON mal formé, octet NUL (`%00`) dans la chaîne de
      requête ou le corps (`code: INVALID_CHARACTER`), identifiant de chemin
      qui n'est pas un entier entre 0 et 2147483647 (plage `INTEGER`
      PostgreSQL). Ces contrôles ont lieu avant toute requête SQL.
    - **413** : corps de plus de 100 Ko.
    - **415** : jeu de caractères ou encodage du corps non pris en charge.
    Les caractères de contrôle d'un paramètre `search` sont remplacés par une
    espace.
  version: 4.14.1
  contact:
    name: Vol d'Histoire
    url: https://vol-histoire.titouan-borde.com

servers:
  - url: /api
    description: API principale

tags:
  - name: Auth
    description: Inscription, connexion, tokens, vérification email, mot de passe oublié
  - name: Users
    description: Profil utilisateur et administration
  - name: Airplanes
    description: Avions — lecture, création, modification, suppression
  - name: Referentials
    description: Pays, générations, types, constructeurs
  - name: Favorites
    description: Gestion des favoris utilisateur
  - name: Stats
    description: Statistiques globales
  - name: Monitoring
    description: Liveness, readiness, métriques Prometheus, statut applicatif
  - name: Config
    description: Configuration publique exposée au frontend
  - name: Content
    description: Frise chronologique éditoriale
  - name: Contact
    description: Formulaire de contact du site

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token JWT (15 min). Obtenu via POST /login ou POST /refresh.

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: Erreur serveur
        errorId:
          type: string
          example: a3f1b2c4

    WarSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: Guerre du Vietnam }
        name_fr: { type: string, example: Guerre du Vietnam }
        slug: { type: string, example: guerre-du-vietnam }
        date_start: { type: string, format: date, nullable: true }
        date_end: { type: string, format: date, nullable: true, description: NULL si le conflit est en cours }
        description: { type: string, nullable: true }
        count: { type: integer, description: Nombre d'appareils rattachés }

    AirplaneSummary:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          description: Nom (traduit selon `?lang=`)
          example: Rafale
        complete_name:
          type: string
          example: Dassault Rafale
        little_description:
          type: string
          description: Description courte traduite. `"Translation needed"` si pas de version EN.
        image_url:
          type: string
          format: uri
        max_speed:
          type: number
        country_name:
          type: string
          description: Nom du pays traduit selon `?lang=`
          example: France
        country_name_fr:
          type: string
          description: |
            **Clé canonique FR** du pays. Toujours en français quelle que soit
            la langue de la requête. À utiliser comme clé d'URL stable pour les
            filtres (`?country=États-Unis` marche en FR et EN).
          example: France
        country_code:
          type: string
          example: FRA
        generation:
          type: integer
          example: 4
        type_name:
          type: string
          description: Nom du type traduit selon `?lang=`
          example: Multirôle
        type_name_fr:
          type: string
          description: |
            **Clé canonique FR** du type. Même rôle que `country_name_fr`.
          example: Multirôle
        date_operationel:
          type: string
          format: date

    AirplaneDetail:
      allOf:
        - $ref: '#/components/schemas/AirplaneSummary'
        - type: object
          properties:
            description:
              type: string
            manufacturer_name:
              type: string
            date_concept:
              type: string
              format: date
            date_first_fly:
              type: string
              format: date
            max_range:
              type: number
            empty_weight:
              type: number
            image_credit:
              type: string
              nullable: true
            image_licence:
              type: string
              nullable: true
            status:
              type: string

    AirplaneInput:
      type: object
      description: |
        Champs éditables d'une fiche. Liste canonique : `backend/utils/airplane-fields.js`
        (`AIRPLANE_FIELDS`), qui pilote l'INSERT et l'UPDATE et dont le formulaire
        d'administration (`frontend/js/shared/airplane-form.js`) est dérivé.
        Une chaîne vide est enregistrée comme `null`. En POST, un champ absent vaut
        `null` ; en PUT, voir la sémantique décrite sur `PUT /airplanes/{id}`.
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        complete_name:
          type: string
          maxLength: 255
        little_description:
          type: string
          maxLength: 255
        image_url:
          type: string
          format: uri
          maxLength: 2048
        description:
          type: string
          maxLength: 10000
        country_id:
          type: integer
        id_manufacturer:
          type: integer
        id_generation:
          type: integer
        type:
          type: integer
        status:
          type: string
          maxLength: 50
        date_concept:
          type: string
          format: date
        date_first_fly:
          type: string
          format: date
        date_operationel:
          type: string
          format: date
        max_speed:
          type: number
        max_range:
          type: number
        length:
          type: number
          minimum: 0
        wingspan:
          type: number
          minimum: 0
        height:
          type: number
          minimum: 0
        wing_area:
          type: number
          minimum: 0
        empty_weight:
          type: number
        mtow:
          type: number
          minimum: 0
        service_ceiling:
          type: integer
          minimum: 0
        climb_rate:
          type: number
          minimum: 0
        g_limit_pos:
          type: number
        g_limit_neg:
          type: number
        combat_radius:
          type: number
          minimum: 0
        crew:
          type: integer
          minimum: 0
        engine_name:
          type: string
          maxLength: 255
        engine_count:
          type: integer
          minimum: 0
        engine_type:
          type: string
          maxLength: 100
        engine_type_en:
          type: string
          maxLength: 100
          description: Type de motorisation en anglais (servi par `engine_type` quand `?lang=en`).
        thrust_dry:
          type: number
          minimum: 0
        thrust_wet:
          type: number
          minimum: 0
        production_start:
          type: integer
        production_end:
          type: integer
        units_built:
          type: integer
          minimum: 0
        unit_cost_usd:
          type: integer
          minimum: 0
        unit_cost_year:
          type: integer
        operators_count:
          type: integer
          minimum: 0
        variants:
          type: string
          maxLength: 5000
        variants_en:
          type: string
          maxLength: 5000
          description: Variantes en anglais (servies par `variants` quand `?lang=en`).
        stealth_level:
          type: string
          enum: [aucune, reduite, moderee, elevee, tres_elevee]
        nickname:
          type: string
          maxLength: 255
        predecessor_id:
          type: integer
        successor_id:
          type: integer
        rival_id:
          type: integer
        wikipedia_fr:
          type: string
          format: uri
          maxLength: 500
        wikipedia_en:
          type: string
          format: uri
          maxLength: 500
        youtube_showcase:
          type: string
          format: uri
          maxLength: 500
        manufacturer_page:
          type: string
          format: uri
          maxLength: 500
        image_credit:
          type: string
          maxLength: 255
        image_licence:
          type: string
          maxLength: 100

    Armament:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    Tech:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    Mission:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    War:
      type: object
      properties:
        name:
          type: string
        name_fr:
          type: string
          description: Nom canonique français (valeur du filtre `war`)
        slug:
          type: string
          description: Identifiant de la page /conflits/{slug}
        date_start:
          type: string
          format: date
        date_end:
          type: string
          format: date
        description:
          type: string

    RelatedData:
      type: object
      properties:
        armament:
          type: array
          items:
            $ref: '#/components/schemas/Armament'
        tech:
          type: array
          items:
            $ref: '#/components/schemas/Tech'
        missions:
          type: array
          items:
            $ref: '#/components/schemas/Mission'
        wars:
          type: array
          items:
            $ref: '#/components/schemas/War'

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role_id:
          type: integer
          enum: [1, 2, 3]
          description: "1=admin, 2=éditeur, 3=membre"

    Country:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string

    Stats:
      type: object
      properties:
        airplanes:
          type: integer
        earliest_year:
          type: integer
          nullable: true
        latest_year:
          type: integer
          nullable: true
        countries:
          type: integer
        generations:
          type: integer

  parameters:
    AirplaneId:
      name: id
      in: path
      required: true
      description: Entier de 0 à 2147483647 ; toute autre valeur → 400.
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647
    UserId:
      name: id
      in: path
      required: true
      description: Entier de 0 à 2147483647 ; toute autre valeur → 400.
      schema:
        type: integer
        minimum: 0
        maximum: 2147483647

paths:
  # ═══════════════════════════════════════════════════════════
  # AUTH
  # ═══════════════════════════════════════════════════════════
  /register:
    post:
      tags: [Auth]
      summary: Inscription
      description: Crée un compte et envoie un email de vérification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 255
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: "1 majuscule, 1 minuscule, 1 chiffre minimum"
                'h-captcha-response':
                  type: string
                  description: |
                    Token hCaptcha (optionnel). Vérifié côté serveur si
                    `HCAPTCHA_SECRET` est configuré, sinon ignoré.
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  warning:
                    type: string
                    enum: [EMAIL_NOT_SENT]
                    description: Présent si l'email de vérification n'a pas pu être envoyé
        '400':
          description: "Données invalides, email déjà utilisé, ou captcha invalide (code: CAPTCHA_FAILED)"
        '429':
          description: Rate limit (10 req / 15 min)

  /login:
    post:
      tags: [Auth]
      summary: Connexion
      description: |
        Retourne un access token JWT (15 min) dans le body et un refresh token
        en cookie HttpOnly SameSite=Strict (7 jours).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Connexion réussie
          headers:
            Set-Cookie:
              description: refreshToken (HttpOnly, SameSite=Strict, Path=/api)
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                    description: Access token JWT
        '400':
          description: Email ou mot de passe incorrect
        '403':
          description: Email non vérifié (code EMAIL_NOT_VERIFIED)
        '429':
          description: Rate limit (20 req / 15 min)

  /refresh:
    post:
      tags: [Auth]
      summary: Rafraîchir le token
      description: |
        Émet un nouveau access token + rotation du refresh token.
        Le refresh token est lu depuis le cookie `refreshToken`.
      responses:
        '200':
          description: Nouveau token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: |
            Refresh token absent, expiré ou révoqué (REFRESH_REVOKED). Un jeton déjà
            remplacé par rotation et présenté à nouveau (REFRESH_REPLAY) révoque
            toutes les sessions du compte.

  /logout:
    post:
      tags: [Auth]
      summary: Déconnexion
      description: Révoque le refresh token et vide le cookie.
      responses:
        '200':
          description: Déconnexion réussie

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Vérifier l'email et choisir le mot de passe
      description: |
        Le titulaire de la boîte choisit ici le mot de passe actif du compte :
        celui saisi à l'inscription n'est jamais activé, ce qui neutralise la
        pré-inscription d'une adresse par un tiers. Lien à usage unique.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '200':
          description: Email vérifié, compte activé
        '400':
          description: Token invalide ou expiré (code TOKEN_INVALID), ou mot de passe invalide

  /auth/confirm-email-change:
    post:
      tags: [Auth]
      summary: Confirmer un changement d'adresse email
      description: |
        Applique la nouvelle adresse demandée via `PUT /users/{id}`. Lien à usage
        unique envoyé à la nouvelle adresse ; toutes les sessions sont révoquées.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
      responses:
        '200':
          description: Adresse modifiée
        '400':
          description: Token invalide ou expiré (code TOKEN_INVALID)
        '409':
          description: Adresse prise entre-temps (code EMAIL_TAKEN)

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Renvoyer l'email de vérification
      description: Réponse toujours 200 (pas de fuite d'information).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Email envoyé (si le compte existe et n'est pas vérifié)
        '429':
          description: Rate limit (3 req / 15 min)

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Mot de passe oublié
      description: |
        Réponse toujours 200 (pas de fuite d'information sur l'existence du compte).
        Protégé par hCaptcha si `HCAPTCHA_SECRET` est configuré côté serveur.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                'h-captcha-response':
                  type: string
                  description: Token hCaptcha (vérifié si configuré).
      responses:
        '200':
          description: Email de réinitialisation envoyé (si le compte existe)
        '400':
          description: "Captcha invalide (code: CAPTCHA_FAILED) ou email malformé"
        '429':
          description: Rate limit (3 req / 15 min)

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Réinitialiser le mot de passe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  pattern: '^[a-f0-9]{64}$'
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        '200':
          description: Mot de passe réinitialisé
        '400':
          description: Token invalide ou mot de passe non conforme
        '429':
          description: Rate limit (5 req / 15 min)

  # ═══════════════════════════════════════════════════════════
  # USERS
  # ═══════════════════════════════════════════════════════════
  /users:
    get:
      tags: [Users]
      summary: Lister les utilisateurs (admin)
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: Liste paginée
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                      page:
                        type: integer
                      limit:
                        type: integer
                      totalPages:
                        type: integer
        '403':
          description: Accès réservé aux admins

  /users/me/export:
    get:
      tags: [Users]
      summary: Exporter ses données personnelles (JSON)
      description: |
        Droit d'accès et à la portabilité (RGPD art. 15 et 20) : profil et
        favoris du compte connecté, en pièce jointe JSON
        (`vol-histoire-donnees-<id>.json`). Ni hash de mot de passe ni jeton.
        `consent` vaut toujours `null` : le choix de cookies n'est conservé que
        dans le navigateur. Limité à 10 demandes par 15 minutes et par IP.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Données du compte
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="vol-histoire-donnees-42.json"
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                type: object
                required: [exported_at, user, favorites, consent]
                properties:
                  exported_at:
                    type: string
                    format: date-time
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      email: { type: string, format: email }
                      role: { type: string, enum: [admin, editeur, utilisateur], nullable: true }
                      email_verified: { type: boolean }
                      created_at: { type: string, format: date-time }
                      updated_at: { type: string, format: date-time }
                      failed_login_count: { type: integer }
                      locked_until: { type: string, format: date-time, nullable: true }
                  favorites:
                    type: array
                    items:
                      type: object
                      properties:
                        airplane_id: { type: integer }
                        name: { type: string }
                        added_at: { type: string, format: date-time }
                  consent:
                    type: object
                    nullable: true
                    description: Toujours `null` (consentement conservé côté navigateur)
        '401':
          description: Jeton expiré, invalide ou révoqué
        '403':
          description: Non authentifié
        '404':
          description: Compte supprimé entre-temps
        '429':
          description: Trop de demandes d'export

  /users/{id}:
    get:
      tags: [Users]
      summary: Profil utilisateur
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Accès non autorisé (sauf son propre profil ou admin)
        '404':
          description: Utilisateur non trouvé

    put:
      tags: [Users]
      summary: Modifier son profil
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                currentPassword:
                  type: string
                  description: Exigé pour modifier son propre email ou mot de passe
      responses:
        '200':
          description: |
            Mise à jour réussie. Un changement d'email n'est pas appliqué tout de
            suite : un lien de confirmation part vers la nouvelle adresse
            (`emailChangePending`), avec une réponse identique que l'adresse soit
            libre ou déjà prise. Après un changement de mot de passe, un nouvel
            access token est renvoyé (`token`).
        '400':
          description: Données invalides, ou mot de passe actuel manquant (code CURRENT_PASSWORD_REQUIRED)
        '403':
          description: Accès non autorisé, ou mot de passe actuel incorrect (code CURRENT_PASSWORD_INVALID)

    delete:
      tags: [Users]
      summary: Supprimer un compte
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Compte supprimé
        '403':
          description: Accès non autorisé

  /admin/users/{id}:
    put:
      tags: [Users]
      summary: Modifier un utilisateur (admin)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role_id]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                role_id:
                  type: integer
                  enum: [1, 2, 3]
      responses:
        '200':
          description: Utilisateur modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: Accès réservé aux admins
        '409':
          description: Email déjà utilisé

  # ═══════════════════════════════════════════════════════════
  # AIRPLANES
  # ═══════════════════════════════════════════════════════════
  /airplanes:
    get:
      tags: [Airplanes]
      summary: Lister les avions
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [default, alphabetical, nation, service-date, generation, type]
        - name: country
          in: query
          schema:
            type: string
          description: Filtrer par nom de pays
        - name: generation
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
        - name: type
          in: query
          schema:
            type: string
          description: Filtrer par nom de type
        - name: war
          in: query
          schema:
            type: string
          description: >
            Filtrer par conflit (nom canonique français, ex. `Guerre du Vietnam`).
            Combinable avec les autres filtres. 400 si le conflit est inconnu.
        - name: mission
          in: query
          schema:
            type: string
          description: >
            Filtrer par mission (nom canonique français, ex. `Interception`).
            400 si la mission est inconnue.
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
          description: |
            Recherche full-text (PostgreSQL `websearch_to_tsquery`) sur nom,
            nom complet, résumé et description (FR+EN). Syntaxe : mots libres,
            `"phrase exacte"`, `-exclusion`, `OR`. Sans syntaxe avancée, le
            dernier mot est aussi cherché comme **préfixe** (`mira` trouve
            « Mirage ») : les deux requêtes sont combinées par OU. Quand
            `search` est présent, les résultats sont triés par pertinence
            (`ts_rank`), le paramètre `sort` est ignoré.
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Liste des avions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AirplaneSummary'

    post:
      tags: [Airplanes]
      summary: Créer un avion (admin/éditeur)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AirplaneInput'
      responses:
        '201':
          description: Avion créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AirplaneDetail'
        '400':
          description: Données invalides ou référence FK invalide
        '403':
          description: Rôle insuffisant

  /airplanes/facets:
    get:
      tags: [Airplanes]
      summary: Compteurs de facettes pour les filtres du hangar
      description: |
        Retourne les compteurs `{ key: count }` pour les cinq groupes
        de filtres : `countries`, `generations`, `types`, `wars`, `missions`.

        **Pattern faceted search** : chaque groupe est calculé en
        appliquant tous les filtres courants **sauf le sien**, ce qui
        permet d'afficher dans chaque dropdown les compteurs qui restent
        accessibles si on ajoute ce filtre (sans réduire le dropdown
        courant à zéro à cause de lui-même).

        Les clés sont toujours en français (clés canoniques FR), comme
        `country_name_fr` / `type_name_fr` sur les fiches.
      parameters:
        - in: query
          name: country
          schema: { type: string }
          description: Filtre pays canonique FR (ex `France`, `États-Unis`)
        - in: query
          name: generation
          schema: { type: integer }
        - in: query
          name: type
          schema: { type: string }
          description: Filtre type canonique FR (ex `Multirôle`)
        - in: query
          name: war
          schema: { type: string }
          description: Filtre conflit canonique FR (ex `Guerre du Golfe`)
        - in: query
          name: mission
          schema: { type: string }
          description: Filtre mission canonique FR (ex `Interception`)
      responses:
        '200':
          description: Compteurs de facettes
          content:
            application/json:
              schema:
                type: object
                properties:
                  countries:
                    type: object
                    additionalProperties: { type: integer }
                    example:
                      France: 12
                      États-Unis: 8
                  generations:
                    type: object
                    additionalProperties: { type: integer }
                    example:
                      "4": 18
                      "5": 6
                  types:
                    type: object
                    additionalProperties: { type: integer }
                    example:
                      Multirôle: 10
                      Bombardier: 4

  /airplanes/{id}:
    get:
      tags: [Airplanes]
      summary: Détail d'un avion
      parameters:
        - $ref: '#/components/parameters/AirplaneId'
      responses:
        '200':
          description: Détail complet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AirplaneDetail'
        '404':
          description: Avion non trouvé

    put:
      tags: [Airplanes]
      summary: Modifier un avion (admin/éditeur)
      description: |
        **Mise à jour partielle par présence des clés** (seules les colonnes de
        `AirplaneInput` sont prises en compte) :

        - un champ **absent** du corps est **laissé inchangé** ;
        - un champ présent à `null` ou à `""` est **effacé** (colonne mise à `NULL`) ;
        - un champ présent avec une valeur la remplace.

        `name` reste obligatoire dans le corps (validation), même s'il ne change pas.
        Le formulaire d'administration envoie tous ses champs, dont `engine_type_en`
        et `variants_en` ; un client qui ne gère pas une colonne doit l'omettre
        plutôt que l'envoyer vide. Les colonnes `_en` ne figurent pas dans
        `GET /airplanes/{id}?lang=fr` : pour les relire, demander la fiche en
        `?lang=en` (la valeur anglaise y remplace la colonne française, ou vaut
        `"Translation needed"` si elle est vide alors que la française ne l'est pas).
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AirplaneId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AirplaneInput'
            example:
              name: MiG-29
              nickname: Fulcrum
              engine_type_en: Turbofan
              successor_id: null
      responses:
        '200':
          description: Avion modifié (ligne complète après mise à jour)
        '400':
          description: Données invalides, référence FK invalide ou auto-référence (prédécesseur / successeur / rival)
        '403':
          description: Rôle insuffisant
        '404':
          description: Avion non trouvé

    delete:
      tags: [Airplanes]
      summary: Supprimer un avion (admin/éditeur)
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AirplaneId'
      responses:
        '200':
          description: Avion supprimé
        '404':
          description: Avion non trouvé

  /airplanes/{id}/armament:
    get:
      tags: [Airplanes]
      summary: Armement d'un avion
      parameters:
        - $ref: '#/components/parameters/AirplaneId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Armament'

  /airplanes/{id}/tech:
    get:
      tags: [Airplanes]
      summary: Technologies d'un avion
      parameters:
        - $ref: '#/components/parameters/AirplaneId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tech'

  /airplanes/{id}/missions:
    get:
      tags: [Airplanes]
      summary: Missions d'un avion
      parameters:
        - $ref: '#/components/parameters/AirplaneId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Mission'

  /airplanes/{id}/wars:
    get:
      tags: [Airplanes]
      summary: Conflits d'un avion
      parameters:
        - $ref: '#/components/parameters/AirplaneId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/War'

  /airplanes/{id}/related:
    get:
      tags: [Airplanes]
      summary: Toutes les données liées (armement, tech, missions, conflits)
      parameters:
        - $ref: '#/components/parameters/AirplaneId'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatedData'

  /airplanes/{id}/lineage:
    get:
      tags: [Airplanes]
      summary: Chaîne de filiation complète (prédécesseurs et successeurs)
      description: >
        Remonte `predecessor_id` puis redescend `successor_id` de proche en
        proche, jusqu'à 6 maillons de chaque côté. `depth` vaut 0 pour
        l'appareil demandé, négatif pour ses prédécesseurs, positif pour ses
        successeurs ; la chaîne est triée par `depth` croissant.
      parameters:
        - $ref: '#/components/parameters/AirplaneId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, example: 68 }
                        name: { type: string, example: "Mirage 2000" }
                        image_url: { type: string, nullable: true }
                        depth: { type: integer, example: -1 }
                        country_code: { type: string, nullable: true, example: "FRA" }
                        year: { type: integer, nullable: true, example: 1984 }
                  truncated:
                    type: boolean
                    description: Vrai si la profondeur maximale a été atteinte des deux côtés.
        '404':
          description: Avion non trouvé

  /airplanes/{id}/favorite:
    get:
      tags: [Favorites]
      summary: Vérifier si un avion est en favori
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AirplaneId'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  isFavorite:
                    type: boolean

  # ═══════════════════════════════════════════════════════════
  # REFERENTIALS
  # ═══════════════════════════════════════════════════════════
  /countries:
    get:
      tags: [Referentials]
      summary: Pays ayant au moins un avion
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'

  /nations:
    get:
      tags: [Referentials]
      summary: Nations de conception et nombre de fiches
      description: >
        Alimente la carte de l'accueil. `name` suit la langue demandée ;
        `name_fr` porte le nom canonique français, seule valeur acceptée par le
        filtre `country` de `/airplanes`.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code: { type: string, example: "FRA" }
                    name: { type: string, example: "France" }
                    name_fr: { type: string, example: "France" }
                    count: { type: integer, example: 42 }

  /wars:
    get:
      tags: [Referentials]
      summary: Conflits rattachés à au moins un appareil
      description: >
        Ordre chronologique. `name` et `description` suivent la langue
        demandée (`?lang=en`) ; `name_fr` est la valeur acceptée par le filtre
        `war` de `/airplanes`, `slug` celle de `/wars/{slug}` et de la page
        `/conflits/{slug}`. Cacheable (Cache-Control public).
      parameters:
        - name: lang
          in: query
          schema: { type: string, enum: [fr, en] }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WarSummary'

  /credits:
    get:
      tags: [Referentials]
      summary: Crédits photo de toutes les fiches
      description: >
        Source de la page `/credits` (attribution exigée par les licences
        Creative Commons et OGL). Une ligne par fiche, triée par nom ;
        `image_credit` et `image_licence` valent `null` quand la provenance
        n'est pas documentée. Cacheable (Cache-Control public).
      responses:
        '200':
          description: Une ligne par fiche
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    name: { type: string }
                    name_en: { type: string, nullable: true }
                    image_credit: { type: string, nullable: true }
                    image_licence: { type: string, nullable: true, example: 'CC BY-SA 2.0' }

  /timeline:
    get:
      tags: [Content]
      summary: Frise chronologique par décennie (1940 → 2020)
      description: >
        Événements éditoriaux (table `timeline_events`, textes FR et EN) et
        appareils mis en service dans chaque décennie. Réponse mise en cache
        30 minutes (Redis, sinon mémoire) ; l'en-tête `X-Cache` vaut `HIT`
        ou `MISS`. `?force=1` ignore le cache et le recalcule.
      parameters:
        - name: force
          in: query
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: Neuf décennies, de 1940 à 2020
          headers:
            X-Cache: { schema: { type: string, enum: [HIT, MISS] } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at: { type: string, format: date-time }
                  decades:
                    type: array
                    items:
                      type: object
                      properties:
                        decade: { type: integer, example: 1990 }
                        events:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: integer }
                              event_date: { type: string, format: date }
                              kind: { type: string, description: 'Nature de l''événement (war, doctrine, rupture, milestone…)' }
                              title_fr: { type: string }
                              title_en: { type: string, nullable: true }
                              body_fr: { type: string }
                              body_en: { type: string, nullable: true }
                              quote_author_fr: { type: string, nullable: true }
                              quote_author_en: { type: string, nullable: true }
                              airplane:
                                type: object
                                nullable: true
                                description: Appareil illustrant l'événement, s'il y en a un.
                                properties:
                                  id: { type: integer }
                                  name: { type: string }
                                  name_en: { type: string, nullable: true }
                                  image_url: { type: string }
                                  little_description: { type: string, nullable: true }
                                  little_description_en: { type: string, nullable: true }
                        aircraft:
                          type: array
                          description: Appareils dont la mise en service tombe dans la décennie.
                          items:
                            type: object
                            properties:
                              id: { type: integer }
                              name: { type: string }
                              name_en: { type: string, nullable: true }
                              image_url: { type: string }
                              date_operationel: { type: string, format: date }
                              country_name: { type: string }
                              generation: { type: integer, nullable: true }
                              type_name: { type: string }

  /contact:
    post:
      tags: [Contact]
      summary: Envoyer un message par le formulaire de contact
      description: >
        Envoie un email au destinataire configuré (`CONTACT_EMAIL`, sinon
        `MAIL_USER`), en réponse à l'adresse saisie. Protégé par hCaptcha
        (`h-captcha-response`) et limité à 5 messages par 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, message]
              properties:
                firstname: { type: string }
                lastname: { type: string }
                email: { type: string, format: email }
                subject: { type: string, enum: [general, bug, contrib, partner, other], default: general }
                message: { type: string, maxLength: 5000 }
                h-captcha-response: { type: string }
      responses:
        '200':
          description: Message envoyé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '400': { description: 'Email invalide, message absent ou trop long, sujet inconnu, captcha refusé' }
        '429': { description: Trop de messages envoyés }
        '500': { description: Échec de l'envoi de l'email }

  /wars/{slug}:
    get:
      tags: [Referentials]
      summary: Un conflit et les appareils qui y ont été engagés
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9-]{1,120}$', example: guerre-du-vietnam }
        - name: lang
          in: query
          schema: { type: string, enum: [fr, en] }
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WarSummary'
                  - type: object
                    properties:
                      airplanes:
                        type: array
                        description: Triés par date de premier vol
                        items:
                          $ref: '#/components/schemas/AirplaneSummary'
        '400':
          description: Slug au format invalide
        '404':
          description: Conflit inconnu ou sans appareil rattaché

  /generations:
    get:
      tags: [Referentials]
      summary: Générations disponibles
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer

  /types:
    get:
      tags: [Referentials]
      summary: Types d'avions
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string

  /manufacturers:
    get:
      tags: [Referentials]
      summary: Constructeurs
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    code:
                      type: string
                    country_id:
                      type: integer
                    country_name:
                      type: string

  /referentials:
    get:
      tags: [Referentials]
      summary: Tous les référentiels en 1 requête (countries, generations, types, manufacturers, wars, missions)
      description: |
        Endpoint combiné : exécute les 4 requêtes SQL en parallèle et retourne
        un seul payload. Permet au frontend d'éviter 4 round-trips HTTP successifs.
        Cacheable (Cache-Control: public, max-age=300, s-maxage=3600).
      responses:
        '200':
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'public, max-age=300, s-maxage=3600, stale-while-revalidate=600'
          content:
            application/json:
              schema:
                type: object
                properties:
                  countries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                  generations:
                    type: array
                    items:
                      type: integer
                  types:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        description: { type: string, nullable: true }
                  manufacturers:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        code: { type: string }
                        country_id: { type: integer }
                        country_name: { type: string }
                  wars:
                    type: array
                    description: Conflits rattachés à au moins un appareil, ordre chronologique
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        name_fr: { type: string }
                        slug: { type: string }
                        date_start: { type: string, format: date, nullable: true }
                        date_end: { type: string, format: date, nullable: true }
                  missions:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        name_fr: { type: string }
        '500':
          description: Erreur base de données

  # ═══════════════════════════════════════════════════════════
  # HEALTH
  # ═══════════════════════════════════════════════════════════
  /health:
    get:
      tags: [Health]
      summary: Health check (liveness + DB readiness)
      description: Vérifie la connectivité à PostgreSQL via `SELECT 1`. Utilisé par PM2/load balancer.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  uptime: { type: number, description: 'Uptime serveur en secondes' }
                  timestamp: { type: string, format: date-time }
        '503':
          description: Base de données injoignable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: error }
                  message: { type: string }

