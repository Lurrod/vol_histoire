# Apache — vol-histoire.titouan-borde.com, port 443 (DEVOPS-005).
# Copie de /etc/apache2/sites-enabled/vol-histoire-le-ssl.conf relevée le
# 2026-11-25 (certificat géré par certbot). Apache ne fait que le TLS et le
# mandataire : en-têtes de sécurité, CSP, cache et compression viennent de
# l'application (backend/app.js). Modules requis : ssl, proxy, proxy_http,
# rewrite.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName vol-histoire.titouan-borde.com
    RewriteEngine On
    # Fichiers du dépôt qui ne doivent jamais être servis : 404 du site.
    RewriteRule "^/(node_modules|__tests__|coverage)(/|$)|^/(package(-lock)?\.json|jest\.config\.json)$|\.md$" "http://127.0.0.1:3000/404" [P,NC,L]
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    ErrorLog ${APACHE_LOG_DIR}/vol-histoire_error.log
    CustomLog ${APACHE_LOG_DIR}/vol-histoire_access.log combined
SSLCertificateFile /etc/letsencrypt/live/vol-histoire.titouan-borde.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/vol-histoire.titouan-borde.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
