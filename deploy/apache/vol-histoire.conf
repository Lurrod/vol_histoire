# Apache — vol-histoire.titouan-borde.com, port 80 (DEVOPS-005).
# Copie de /etc/apache2/sites-enabled/vol-histoire.conf relevée le 2026-11-25.
# Tout passe en HTTPS, sauf le défi ACME de Let's Encrypt (renouvellement).
<VirtualHost *:80>
    ServerName vol-histoire.titouan-borde.com
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}/$1 [R=301,L]
    ServerSignature Off
    ErrorLog ${APACHE_LOG_DIR}/vol-histoire_error.log
    CustomLog ${APACHE_LOG_DIR}/vol-histoire_access.log combined
</VirtualHost>
