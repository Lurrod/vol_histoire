  <style>
    /* ============================================================
       404 — HORS DES RADARS : même langage que l'accueil et le hangar
       (fond photo flouté ambré, titre condensé bicolore, recherche),
       avec un avion qui écrit « 404 » et un tableau des départs.
       ============================================================ */
    body.page-404 { background: var(--night); }
    body.page-404::before,
    body.page-404::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; }
    body.page-404::before {
      background-image: url('/assets/airplanes/f4-phantom-2.jpg');
      background-size: cover; background-position: center;
      filter: blur(30px) brightness(0.28) saturate(0.7);
      transform: scale(1.15); opacity: 0.55; z-index: -2;
    }
    body.page-404::after {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        radial-gradient(ellipse at 20% 20%, rgba(255, 140, 0, 0.45) 0%, transparent 55%);
      background-size: 60px 60px, 60px 60px, 100% 100%;
    }

    .e4 { min-height: 100vh; display: flex; align-items: center; }
    .e4-grid {
      width: 100%; margin: 0 auto;
      display: grid; grid-template-columns: 1fr; justify-items: center;
      gap: 2.5rem; padding: 7rem 1.5rem 4rem; max-width: 40rem;
    }

    /* ---------- Colonne éditoriale ---------- */
    .e4-left { width: 100%; display: flex; flex-direction: column; align-items: center; text-align: center; }
    .e4-left > * { animation: vh-enter var(--dur-slower) var(--ease-out) backwards; }
    .e4-left > :nth-child(2) { animation-delay: calc(var(--stagger-step) * 1); }
    .e4-left > :nth-child(3) { animation-delay: calc(var(--stagger-step) * 2); }
    .e4-left > :nth-child(4) { animation-delay: calc(var(--stagger-step) * 3); }
    .e4-left > :nth-child(5) { animation-delay: calc(var(--stagger-step) * 4); }
    .e4-left > :nth-child(6) { animation-delay: calc(var(--stagger-step) * 5); }


    .e4-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(2.6rem, 5vw, 4.6rem); font-weight: 700;
      line-height: 0.95; letter-spacing: -0.02em; color: var(--white);
      margin: 0 0 1.5rem;
    }
    .e4-title .gradient-text {
      background: linear-gradient(135deg, #E8C98A 0%, var(--gold) 50%, rgba(255,255,255,0.9) 100%);
      background-size: 220% 100%; background-position: 100% 0;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      animation: e4-shimmer calc(var(--dur-slower) * 3) var(--ease-out) calc(var(--stagger-step) * 8) both;
    }
    @keyframes e4-shimmer { to { background-position: 0% 0; } }

    .e4-lead { margin: 0 auto 2rem; max-width: 32rem; font-size: 1.125rem; line-height: 1.55; color: rgba(255,255,255,0.72); }

    .e4-search { position: relative; display: flex; gap: 0.5rem; width: 100%; max-width: 32rem; margin-bottom: 1.5rem; }
    .e4-search-field { position: relative; flex: 1; min-width: 0; display: flex; }
    .e4-search-icon { position: absolute; left: 1.1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
    .e4-search-input {
      flex: 1; min-width: 0; padding: 0.95rem 1rem 0.95rem 2.8rem;
      font: inherit; font-size: 1rem; color: var(--text-primary);
      background: rgba(255,255,255,0.05); border: 1px solid var(--border-field); border-radius: 12px;
      transition: border-color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
    }
    .e4-search-input::placeholder { color: var(--text-placeholder); }
    .e4-search-input:focus { outline: none; border-color: var(--gold); background: var(--white-a07); }
    .e4-search-input:focus-visible { box-shadow: 0 0 0 3px rgba(200,169,110,0.25); }
    .e4-search .e4-search-btn { flex: none; width: auto; margin: 0; }

    /* ---------- Tableau des départs (404-board.js) ---------- */
    .e4-fids {
      --cell: 0.74em; container-type: inline-size;
      width: 100%; max-width: 40rem; margin-top: 1rem; padding: 1rem 1.25rem 1.1rem;
      border: 1px solid var(--white-a08); border-radius: 16px;
      background: rgba(10, 10, 11, 0.78); box-shadow: 0 24px 60px -30px rgba(0,0,0,0.9);
      text-align: left;
    }
    .e4-fids-head {
      display: flex; align-items: center; gap: 0.6rem; margin: 0 0 0.85rem; padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--white-a08);
      font-size: var(--text-xs); font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.72);
    }
    .e4-fids-head .icon { color: var(--gold); }
    .e4-fids-clock { margin-left: auto; }
    /* Une seule grille : libellés et lignes s'alignent par subgrid. */
    .e4-fids-board {
      list-style: none; margin: 0; padding: 0;
      display: grid; grid-template-columns: repeat(5, max-content); justify-content: space-between;
      column-gap: 0.6em; row-gap: 0.35rem;
      /* Taille des palettes proportionnelle au cadre : largeur totale = 34,7 em
       (39 palettes de 0,74 em, 34 jours de 0,1 em, 4 gouttières de 0,6 em). */
      font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: clamp(0.6rem, 2.85cqi, 1.05rem);
    }
    .e4-fids-board > li, .e4-fids-row { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center; }
    .e4-fids-labels {
      margin-bottom: 0.1rem; font-family: 'DM Sans', sans-serif; font-size: 0.62rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.45);
    }
    .e4-fids-row {
      position: relative; margin: 0 -0.5rem; padding: 0.3rem 0.5rem; border-radius: 8px;
      color: inherit; text-decoration: none;
      transition: background-color var(--dur-fast) var(--ease-out);
    }
    a.e4-fids-row[href]:hover, a.e4-fids-row[href]:focus-visible { background: var(--gold-a08); }
    a.e4-fids-row:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
    .e4-fld { display: flex; gap: 0.1em; }
    /* Une palette : deux demi-plaques séparées par la charnière. */
    .e4-flap {
      display: grid; place-items: center; width: var(--cell); height: 1.5em; border-radius: 3px;
      background: linear-gradient(#1d1d20 0 49%, #050505 49% 53%, #17171a 53%);
      color: #F2EBDD; line-height: 1; backface-visibility: hidden;
    }
    .e4-fld.is-dest .e4-flap { color: #E8C98A; }
    .e4-fids-row.is-cancelled .e4-fld.is-status .e4-flap { color: var(--accent-text); }
    .e4-fids-row.is-boarding .e4-fld.is-status .e4-flap { color: var(--hud-green-text); }
    /* Embarquement : le statut clignote doucement (boucle). */
    .e4-fids-row.is-boarding.is-settled .e4-fld.is-status { animation: e4-board 1.4s var(--ease-in-out) infinite alternate; }
    @keyframes e4-board { to { opacity: 0.45; } }
    .e4-fids-row.is-cancelled .e4-fld.is-dest .e4-flap { color: rgba(242,235,221,0.55); }
    /* ---------- Tablette et téléphone ---------- */
    @media (max-width: 63.99em) {
      .e4 { min-height: 0; }
      .e4-grid { padding: 7rem 1.5rem 3rem; }
    }
    @media (max-width: 30em) {
      .e4-grid { padding: 7.5rem 1rem 2.5rem; }
      .e4-fids { padding: 0.9rem 0.85rem 1rem; }
      /* Trois colonnes : 29 palettes, largeur 25,3 em. */
      .e4-fids-board { font-size: clamp(0.6rem, 3.9cqi, 1.05rem); }
      .e4-fids .is-flight, .e4-fids .is-gate { display: none; }
      .e4-fids-board { grid-template-columns: repeat(3, max-content); }
      .e4-search { flex-direction: column; }
      .e4-search .e4-search-btn { width: 100%; }
    }
    /* ---------- Écriture dans le ciel (404-sky.js) ---------- */
    .e4-sky {
      position: relative; display: block; width: 100%; max-width: 34rem; margin: 0 auto 1.25rem; align-self: center;
      padding: 0; border: 0; background: none; cursor: pointer; border-radius: 12px;
    }
    .e4-sky:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    .e4-sky-svg { display: block; width: 100%; height: auto; overflow: hidden; }
    .e4-trail { fill: none; stroke: #E8C98A; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.4; opacity: 0.35;
      transition: opacity 2.4s var(--ease-out), stroke-width 2.4s var(--ease-out); }
    .e4-trail.e4-glyph { stroke: var(--gold); stroke-width: 6; opacity: 0.95; }
    .e4-trails { transition: filter 3s var(--ease-out); }
    /* Traînée qui s'étale et se dilue, comme une vraie traînée de condensation. */
    .e4-sky.is-done .e4-trails { filter: blur(0.8px); }
    .e4-sky.is-done .e4-trail { opacity: 0.12; }
    .e4-sky.is-done .e4-trail.e4-glyph { opacity: 0.9; stroke-width: 9; }
    .e4-plane path { fill: var(--white); }
    .e4-plane { opacity: 0; transition: opacity var(--dur-fast) var(--ease-out); }
    .e4-sky.is-flying .e4-plane { opacity: 1; }
    .e4-sky-replay {
      position: absolute; right: 0.5rem; bottom: 0.25rem; display: grid; place-items: center;
      width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--white-a08);
      color: rgba(255,255,255,0.6); font-size: 0.75rem; opacity: 0;
      transition: opacity var(--dur-fast) var(--ease-out), rotate var(--dur-slow) var(--ease-out);
    }
    .e4-sky.is-done:hover .e4-sky-replay, .e4-sky.is-done:focus-visible .e4-sky-replay { opacity: 1; rotate: -180deg; }

    @media (prefers-reduced-motion: reduce) {
      .e4-left > *, .e4-title .gradient-text, .e4-fids-row .e4-fld.is-status { animation: none; }
    }
  </style>
</head>
<body class="page-404">

  <main id="main-content" class="error-page e4">
    <div class="e4-grid">
      <div class="e4-left">
        <button type="button" class="e4-sky" id="e4-sky" data-i18n-aria="error404.sky_aria" aria-label="Rejouer l’animation : un avion écrit 404 dans le ciel">
          <svg class="e4-sky-svg" viewBox="-27 0 620 230" aria-hidden="true" focusable="false">
            <defs>
              <filter id="e4-diffuse" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur id="e4-blur" stdDeviation="0"/></filter>
            </defs>
            <g class="e4-trails" filter="url(#e4-diffuse)">
              <!-- Chiffres (traînées franches) et liaisons (virages, plus ténues) : un seul vol. -->
              <path class="e4-trail" d="M 30 120 C 60 120, 110 205, 125 205"/>
              <path class="e4-trail e4-glyph" d="M 125 205 L 125 25 L 38 145 L 172 145"/>
              <path class="e4-trail" d="M 172 145 C 215 145, 240 25, 305 25"/>
              <path class="e4-trail e4-glyph" d="M 305 25 A 58 90 0 1 1 304.9 25"/>
              <path class="e4-trail" d="M 304.9 25 C 380 25, 410 215, 480 205"/>
              <path class="e4-trail e4-glyph" d="M 480 205 L 480 25 L 393 145 L 527 145"/>
              <path class="e4-trail" d="M 527 145 C 570 145, 600 90, 660 40"/>
            </g>
            <g class="e4-plane" id="e4-plane">
              <path d="M 13 0 L 3 -2 L -3 -10 L -6 -10 L -3 -2 L -9 -2 L -12 -6 L -14 -6 L -12 0 L -14 6 L -12 6 L -9 2 L -3 2 L -6 10 L -3 10 L 3 2 Z"/>
            </g>
          </svg>
          <span class="e4-sky-replay" aria-hidden="true"><i class="fas fa-redo"></i></span>
        </button>
        <h1 class="e4-title"><span class="sr-only" data-i18n="error404.sr_prefix">Erreur 404 : </span><span data-i18n="error404.title_1">Hors des</span><br><span class="gradient-text" data-i18n="error404.title_2">radars.</span></h1>
        <p class="e4-lead" data-i18n="error404.lead">Cette page n’existe pas, ou elle a changé d’adresse.</p>

        <form class="e4-search" action="/hangar" method="get" role="search">
          <label for="e4-q" class="sr-only" data-i18n="error404.search_label">Chercher un appareil</label>
          <span class="e4-search-field">
            <i class="fas fa-search e4-search-icon" aria-hidden="true"></i>
            <input id="e4-q" class="e4-search-input" type="search" name="search" placeholder="Rafale, Tu-95, C-130…" autocomplete="off">
          </span>
          <button type="submit" class="btn btn-primary e4-search-btn" data-i18n="error404.search_btn">Chercher</button>
        </form>

        <section class="e4-fids" aria-labelledby="e4-fids-title">
          <h2 class="e4-fids-head">
            <i class="fas fa-plane-departure" aria-hidden="true"></i>
            <span id="e4-fids-title" data-i18n="error404.board_title">Départs</span>
            <span class="e4-fids-clock" id="e4-fids-clock" aria-hidden="true"></span>
          </h2>
          <ol class="e4-fids-board" id="e4-fids-board">
            <li class="e4-fids-labels" aria-hidden="true">
              <span data-i18n="error404.col_time">Heure</span><span class="is-flight" data-i18n="error404.col_flight">Vol</span><span data-i18n="error404.col_dest">Destination</span><span class="is-gate" data-i18n="error404.col_gate">Porte</span><span data-i18n="error404.col_status">Statut</span>
            </li>
          </ol>
        </section>
      </div>

    </div>
  </main>

  <!-- @include footer -->

  <div id="toast-container" class="toast-container" aria-live="polite"></div>
