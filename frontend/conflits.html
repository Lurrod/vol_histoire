<!-- page-favorites : la page réutilise le bandeau et la grille de cartes de
     favorites.css (bundle conflicts.min.css), page-conflicts porte le reste. -->
<body class="page-favorites page-conflicts">
<a href="#main-content" class="skip-link">Aller au contenu</a>

  <!-- Header -->
  <!-- @include header -->

  <main id="main-content">
  <section class="page-hero" aria-labelledby="page-hero-heading">
    <div class="hero-background"></div>
    <div class="container">
      <nav class="breadcrumb" aria-label="Fil d'Ariane">
        <a href="/"><i class="fas fa-home" aria-hidden="true"></i> <span data-i18n="nav.home">Accueil</span></a>
        <i class="fas fa-chevron-right" aria-hidden="true"></i>
        <a href="/conflits" id="crumb-conflicts" data-i18n="conflicts.breadcrumb">Conflits</a>
        <span id="crumb-current" class="hidden"><i class="fas fa-chevron-right" aria-hidden="true"></i> <span aria-current="page" id="crumb-current-name"></span></span>
      </nav>
      <div class="page-hero-inner">
        <div class="hero-text">
          <div class="hero-eyebrow"><span id="hero-eyebrow" data-i18n="conflicts.eyebrow">Depuis 1945</span></div>
          <h1 id="page-hero-heading" data-i18n-html="conflicts.hero_title">Les<span class="hero-muted">Conflits</span></h1>
          <p id="hero-desc" data-i18n="conflicts.hero_desc">Les guerres et les crises armées depuis 1945, et les appareils du catalogue qui y ont été engagés.</p>
        </div>
        <div class="hero-data">
          <div class="data-row">
            <span class="data-number" id="stat-a">–</span>
            <span class="data-label" id="stat-a-label" data-i18n="conflicts.stat_conflicts">Conflits</span>
          </div>
          <div class="data-row">
            <span class="data-number" id="stat-b">–</span>
            <span class="data-label" id="stat-b-label" data-i18n="conflicts.stat_aircraft">Engagements</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="favorites-section conflicts-section">
    <div class="container">
      <!-- Chargement : silhouettes de cartes, retirées au premier rendu -->
      <div id="conflicts-loading" class="conflicts-grid" aria-hidden="true">
        <div class="conflict-card skeleton-conflict"><span class="skeleton-line short"></span><span class="skeleton-line"></span><span class="skeleton-line medium"></span></div>
        <div class="conflict-card skeleton-conflict"><span class="skeleton-line short"></span><span class="skeleton-line"></span><span class="skeleton-line medium"></span></div>
        <div class="conflict-card skeleton-conflict"><span class="skeleton-line short"></span><span class="skeleton-line"></span><span class="skeleton-line medium"></span></div>
        <div class="conflict-card skeleton-conflict"><span class="skeleton-line short"></span><span class="skeleton-line"></span><span class="skeleton-line medium"></span></div>
        <div class="conflict-card skeleton-conflict"><span class="skeleton-line short"></span><span class="skeleton-line"></span><span class="skeleton-line medium"></span></div>
        <div class="conflict-card skeleton-conflict"><span class="skeleton-line short"></span><span class="skeleton-line"></span><span class="skeleton-line medium"></span></div>
      </div>

      <!-- Vue « liste » : un conflit par carte, ordre chronologique -->
      <div id="conflicts-list" class="conflicts-grid hidden"></div>

      <!-- Vue « conflit » : appareils engagés -->
      <div id="conflict-detail" class="hidden">
        <div class="conflict-actions">
          <a id="conflict-hangar-link" class="btn btn-primary" href="/hangar"><i class="fas fa-plane"></i> <span data-i18n="conflicts.explore_hangar">Filtrer dans le hangar</span></a>
          <a class="btn btn-ghost" href="/conflits"><i class="fas fa-arrow-left"></i> <span data-i18n="conflicts.all_conflicts">Tous les conflits</span></a>
        </div>
        <h2 class="conflict-aircraft-heading" data-i18n="conflicts.aircraft_heading">Appareils engagés</h2>
        <section id="conflict-aircraft" class="aircraft-grid" aria-label="Appareils engagés" data-i18n-aria="conflicts.aircraft_heading"></section>
      </div>

      <div id="conflicts-error" class="empty-state hidden">
        <i class="fas fa-exclamation-triangle"></i>
        <h3 data-i18n="conflicts.not_found">Conflit introuvable</h3>
        <p><a href="/conflits" data-i18n="conflicts.all_conflicts">Tous les conflits</a></p>
      </div>
    </div>
  </section>
  </main>

  <!-- Footer -->
  <!-- @include footer -->
  <div id="toast-container" aria-live="polite"></div>
  <script defer src="/js/vendor/purify.min.js"></script>
  <script defer src="/js/dist/app.min.js"></script>
  <script defer src="/js/dist/icons.min.js"></script>
  <script defer src="/js/sentry-init.js"></script>
  <script defer src="/js/dist/conflicts.min.js"></script>
</body>
</html>
